# Repo-owned Policy Bot policy source.
# Keep this file for repository-specific trusted automation and policies that
# are stricter than the shared .policy-bot/base-policy.yml baseline.
# Security-owned base-policy.yml changes should stay identical across
# repositories.
#
# Entries after repo-trusted-automation-approvals are injected under the shared
# baseline reviewer exception list.
# Entries after repo-human-review-requirements are injected under the shared
# normal human-review branch.
# Entries after repo-required-approvals are injected under policy.approval[0].and.
# Entries after repo-human-reviewer-teams are injected under the shared human
# reviewer team list.
# Entries after repo-approval-rules are injected under top-level approval_rules.
#
# Generated proto update PRs opened by nombot from scout's go-protos-publish
# workflow intentionally fall through to the baseline one-human-reviewer rule.

