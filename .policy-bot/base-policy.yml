# Policy-bot base policy source for Nominal software repositories.
# Security owns this baseline. Repo owners may add repo-specific trusted
# automation and stricter repo-specific policies in .policy-bot/repo-policy.yml.
# Human-review rules use the teams listed in &human_reviewer_teams. Keep
# robot accounts in nominal-io/robots for author classification only; robots
# must not be added to reviewer teams.
policy:
  approval:
    - and:
        - or:
            - trusted release automation
            - trusted deploy automation
            # policy-bot-render:repo-trusted-automation-approvals
            - renovate PR needs one human reviewer
            - and:
                - one human reviewer
                - bot-authored PR needs two human reviewers
                # policy-bot-render:repo-human-review-requirements
        - policy file changes require policy owner review
        # policy-bot-render:repo-required-approvals
  disapproval:
    requires:
      organizations:
        - nominal-io

approval_rules:
  - name: policy file changes require policy owner review
    description: >-
      Changes to Policy Bot policy files, source files, renderer, or validation
      workflow require at least one non-author reviewer from nominal-io/security,
      nominal-io/dev-infra, nominal-io/deployability, or nominal-io/admins.
    if:
      changed_files:
        paths:
          - '^\.policy\.ya?ml$'
          - '^policy\.ya?ml$'
          - '^\.policy-bot/.*$'
          - '^scripts/render-policy-bot-policy\.sh$'
          - '^\.github/workflows/validate-policy-bot\.yml$'
    options:
      allow_author: false
      allow_contributor: true
      ignore_edited_comments: false
      methods:
        comments: []
        github_review: true
    requires:
      count: 1
      teams:
        - nominal-io/security
        - nominal-io/dev-infra
        - nominal-io/deployability
        - nominal-io/admins

  - name: one human reviewer
    description: >-
      Every change requires at least one non-author human reviewer from the
      configured human reviewer teams. Robot accounts live in nominal-io/robots
      for author classification only and do not satisfy reviewer-team
      membership.
    options:
      allow_author: false
      allow_contributor: true
      ignore_edited_comments: false
      methods:
        comments: []
        github_review: true
    requires:
      count: 1
      teams: &human_reviewer_teams
        - nominal-io/software
        - nominal-io/mission
        # policy-bot-render:repo-human-reviewer-teams

  - name: bot-authored PR needs two human reviewers
    description: >-
      PRs opened by agentic bot or GitHub App authors require two non-author
      human reviewers from the listed human-only reviewer teams. Deterministic
      automation such as Dependabot and nombotv2 falls through to the baseline
      one-human reviewer requirement. Atlas and other automation may still
      approve or comment, but those approvals do not satisfy this policy.
    if:
      has_author_in:
        users:
          - claude[bot]
          - cursor[bot]
          - devin-ai-integration[bot]
          - nominal-atlas-dev[bot]
          - nominal-atlas[bot]
        teams:
          - nominal-io/robots
    options:
      allow_author: false
      allow_contributor: true
      ignore_edited_comments: false
      methods:
        comments: []
        github_review: true
    requires:
      count: 2
      teams: *human_reviewer_teams

  - name: renovate PR needs one human reviewer
    description: >-
      Renovate dependency PRs are allowed to use Renovate/GitHub automerge after
      one human reviewer and normal required checks pass. This exempts Renovate
      from the two-human bot-authored PR rule, but not from the baseline human
      review requirement.
    if:
      has_author_in:
        users:
          - nominal-bot
          - renovate[bot]
      from_branch:
        pattern: "^(nominal-io:)?renovate/"
    options:
      allow_author: false
      allow_contributor: true
      ignore_edited_comments: false
      methods:
        comments: []
        github_review: true
    requires:
      count: 1
      teams: *human_reviewer_teams

  - name: trusted release automation
    description: >-
      Release-please PRs created by nominal-bot may be auto-merged by the
      existing release automation when they come from the standard release-please
      branch pattern, target main, have only nominal-bot contributors, and match
      the release PR title convention.
    if:
      has_author_in:
        users:
          - nominal-bot
      only_has_contributors_in:
        users:
          - nominal-bot
      targets_branch:
        pattern: "^main$"
      from_branch:
        pattern: "^(nominal-io:)?release-please--branches--main($|--)"
      title:
        matches:
          - "^chore\\(main\\): release"

  - name: trusted deploy automation
    description: >-
      The fleet-infra production deploy PR is generated from the fixed
      nombot/deploy-gp-056857239961-cluster-0 branch and already enables GitHub
      auto-merge after repository checks pass. Keep that narrow path exempt so
      the existing release/deploy flow continues to work.
    if:
      has_author_in:
        users:
          - nominal-bot
      only_has_contributors_in:
        users:
          - nominal-bot
      targets_branch:
        pattern: "^main$"
      from_branch:
        pattern: "^(nominal-io:)?nombot/deploy-gp-056857239961-cluster-0$"
      title:
        matches:
          - "^feat: deploy version changes to gp-056857239961-cluster-0$"
      has_labels:
        - release-please

  # policy-bot-render:repo-approval-rules
