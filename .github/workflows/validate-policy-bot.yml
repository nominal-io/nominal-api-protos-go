name: Validate Policy Bot config

on:
  pull_request_target:
    paths:
      - ".policy.yml"
      - ".policy.yaml"
      - "policy.yml"
      - "policy.yaml"
      - ".policy-bot/**"
      - "scripts/render-policy-bot-policy.sh"
      - ".github/workflows/validate-policy-bot.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  POLICY_BOT_IMAGE: docker.io/palantirtechnologies/policy-bot@sha256:1babe4d474db1ed7184146fbd2d332138c30121b2f860451347d9dbb825f5a20
  POLICY_BOT_VERSION: "1.41.1"

jobs:
  validate-policy-bot-config:
    name: Validate Policy Bot config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch policy files
        id: policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && github.repository || github.event.pull_request.head.repo.full_name }}
          POLICY_REF: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          policy_dir="${RUNNER_TEMP}/policy-bot"
          mkdir -p "$policy_dir"

          fetch_raw_file() {
            local source_path="$1"
            local destination="$2"
            local url="${GITHUB_API_URL}/repos/${POLICY_REPOSITORY}/contents/${source_path}?ref=${POLICY_REF}"
            local response="${policy_dir}/response"
            local http_status

            http_status="$(curl --silent --show-error --location \
              --output "$response" \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github.raw" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$url")"

            if [[ "$http_status" == "200" ]]; then
              mv "$response" "$destination"
              return 0
            fi

            cat "$response" >&2 || true
            echo "::error::Failed to fetch ${source_path} at ${POLICY_REF}; HTTP ${http_status}"
            exit 1
          }

          fetch_raw_file ".policy.yml" "${policy_dir}/policy.yml"
          fetch_raw_file ".policy-bot/base-policy.yml" "${policy_dir}/base-policy.yml"
          fetch_raw_file ".policy-bot/repo-policy.yml" "${policy_dir}/repo-policy.yml"
          fetch_raw_file "scripts/render-policy-bot-policy.sh" "${policy_dir}/render-policy-bot-policy.sh"
          echo "policy-path=.policy.yml" >> "$GITHUB_OUTPUT"

      - name: Check generated policy file
        shell: bash
        run: |
          set -euo pipefail

          policy_dir="${RUNNER_TEMP}/policy-bot"
          bash -n "${policy_dir}/render-policy-bot-policy.sh"

          {
            echo "# Code generated by scripts/render-policy-bot-policy.sh from .policy-bot/base-policy.yml and .policy-bot/repo-policy.yml. DO NOT EDIT DIRECTLY."
            awk \
              -v repo_policy="${policy_dir}/repo-policy.yml" '
                function insert_section(path, section, fallback, line, active, marker, emitted) {
                  active = 0
                  emitted = 0
                  while ((getline line < path) > 0) {
                    if (line ~ /^[[:space:]]*#[[:space:]]*policy-bot-render:/) {
                      marker = line
                      sub(/^[[:space:]]*#[[:space:]]*policy-bot-render:/, "", marker)
                      sub(/[[:space:]]*$/, "", marker)
                      active = (marker == section)
                    } else if (active && line !~ /^[[:space:]]*$/ && line !~ /^[[:space:]]*#/) {
                      print line
                      emitted = 1
                    }
                  }
                  close(path)
                  if (!emitted && fallback != "") {
                    print fallback
                  }
                }

                /^[[:space:]]*#[[:space:]]*policy-bot-render:repo-trusted-automation-approvals[[:space:]]*$/ {
                  insert_section(repo_policy, "repo-trusted-automation-approvals", $0)
                  next
                }

                /^[[:space:]]*#[[:space:]]*policy-bot-render:repo-human-review-requirements[[:space:]]*$/ {
                  insert_section(repo_policy, "repo-human-review-requirements", $0)
                  next
                }

                /^[[:space:]]*#[[:space:]]*policy-bot-render:repo-required-approvals[[:space:]]*$/ {
                  insert_section(repo_policy, "repo-required-approvals", "")
                  next
                }

                /^[[:space:]]*#[[:space:]]*policy-bot-render:repo-human-reviewer-teams[[:space:]]*$/ {
                  insert_section(repo_policy, "repo-human-reviewer-teams", $0)
                  next
                }

                /^[[:space:]]*#[[:space:]]*policy-bot-render:repo-approval-rules[[:space:]]*$/ {
                  insert_section(repo_policy, "repo-approval-rules", "")
                  next
                }

                { print }
              ' "${policy_dir}/base-policy.yml"
          } > "${policy_dir}/rendered.policy.yml"

          if ! cmp -s "${policy_dir}/policy.yml" "${policy_dir}/rendered.policy.yml"; then
            echo "::error::.policy.yml is stale. Run scripts/render-policy-bot-policy.sh and commit the result."
            diff -u "${policy_dir}/policy.yml" "${policy_dir}/rendered.policy.yml" || true
            exit 1
          fi

      - name: Validate policy file
        shell: bash
        run: |
          set -euo pipefail

          policy_dir="${RUNNER_TEMP}/policy-bot"
          echo "Validating ${{ steps.policy.outputs.policy-path }} with Policy Bot ${POLICY_BOT_VERSION}"
          docker pull "$POLICY_BOT_IMAGE"
          docker run --rm --pull=never \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -v "${policy_dir}:/workspace:ro" \
            "$POLICY_BOT_IMAGE" \
            validate -p /workspace/rendered.policy.yml
