name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify generated code
        run: |
          ./scripts/generate.sh
          go mod tidy
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - run: go build ./...
      - run: go test -race ./...
      - run: go vet ./...
