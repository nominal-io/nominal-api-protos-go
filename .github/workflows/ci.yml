name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check-generated:
    name: Check generated bindings
    # Fork pull requests cannot read the private upstream proto package.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          registry-url: https://npm.pkg.github.com
      - name: Regenerate and compare with committed bindings
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NOMBOT_CLASSIC_PERSONAL_ACCESS_TOKEN }}
        run: |
          scripts/update-protos.sh "$(cat PROTO_SOURCE_VERSION)"
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            git diff
            exit 1
          fi
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
