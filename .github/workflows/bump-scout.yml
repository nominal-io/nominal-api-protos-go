name: Bump scout API

on:
  schedule:
    # Mondays at 13:00 UTC.
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bump-scout
  cancel-in-progress: true

jobs:
  bump-scout:
    name: Bump scout API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          registry-url: https://npm.pkg.github.com
          scope: "@nominal-io"

      - name: Regenerate from the latest scout protos
        id: bump
        env:
          # The scout API packages live under the scout repo on GitHub Packages, which the workflow
          # token cannot read; the org bot token can, as in nominal-client-ts.
          NODE_AUTH_TOKEN: ${{ secrets.NOMBOT_CLASSIC_PERSONAL_ACCESS_TOKEN }}
        run: |
          echo "before=$(cat SCOUT_VERSION)" >> "$GITHUB_OUTPUT"
          scripts/bump-scout.sh
          echo "after=$(cat SCOUT_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          go mod tidy
          go build ./...
          go vet ./...
          go test -race ./...

      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          # The org bot token, not GITHUB_TOKEN, so CI and the PR-title lint run on the PR.
          token: ${{ secrets.NOMBOT_CLASSIC_PERSONAL_ACCESS_TOKEN }}
          commit-message: "feat(api): bump scout api to ${{ steps.bump.outputs.after }}"
          title: "feat(api): bump scout api to ${{ steps.bump.outputs.after }}"
          body: |
            Regenerates the Go bindings from `@nominal-io/proto-zip-npm-files` ${{ steps.bump.outputs.before }} -> ${{ steps.bump.outputs.after }}.

            ### Docs impact

            - [x] **Is this a user-facing change?** Yes, the published API surface follows scout.

            ### Testing plan

            `go build`, `go vet`, and `go test -race` passed in the bump workflow; CI reruns them here.
          branch: nombot/bump-scout
          delete-branch: true
