name: release-please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Open the release PR, or tag and release once it is merged
    runs-on: ubuntu-latest
    steps:
      # A GitHub App installation token has its own rate limit instead of sharing the bot user's,
      # and unlike GITHUB_TOKEN its release PR triggers CI and the PR-title lint.
      - name: Get app token
        id: app-token
        uses: nominal-io/workflow-application-token-action@d8644a5aa546f763f73b94c762b092e088486db7 # v0.0.1
        with:
          application_id: ${{ secrets.NOMBOT_APP_ID }}
          application_private_key: ${{ secrets.NOMBOT_PRIVATE_KEY }}
          organization: "nominal-io"
          permissions: "contents:write, pull_requests:write, issues:write"
          revoke_token: true

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
