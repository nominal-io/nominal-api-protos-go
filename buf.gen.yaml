version: v2
managed:
  enabled: true
  # Third-party imports use the Go packages published by their owners.
  disable:
    - file_option: go_package
      path: google
    - file_option: go_package
      path: buf
  override:
    - file_option: go_package_prefix
      value: github.com/nominal-io/nominal-api-protos-go
plugins:
  - local: protoc-gen-go
    out: .
    opt: module=github.com/nominal-io/nominal-api-protos-go
  - local: protoc-gen-go-grpc
    out: .
    opt: module=github.com/nominal-io/nominal-api-protos-go
